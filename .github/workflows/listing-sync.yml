# Twice-daily sync for Jared's own listing pages (D-298, D-299, tools/sync_listings.mjs).
# Reads his active and sold listings from MyRealPage. A changed price or a sale is written, the site is built and tested, and the change is
# pushed to main, which deploys it. A new listing gets a page built from its MyRealPage page (D-302). Anything else (a listing that left
# the market unsold, a new listing whose page could not be built) and every page it made goes in one issue,
# which is only added to when the report changes and is closed when nothing needs a look.
name: Listing sync
on:
  schedule:
    - cron: '23 13 * * *'   # 5:23 or 6:23 am Pacific
    - cron: '23 22 * * *'   # 2:23 or 3:23 pm Pacific
  workflow_dispatch:
    inputs:
      dry:
        description: 'Report only, change nothing'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: listing-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: sync
        run: node tools/sync_listings.mjs ${{ inputs.dry && '--dry' || '' }}
      - if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm run lastmod
          npm test
      - if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "listing-sync"
          git config user.email "listing-sync@users.noreply.github.com"
          git add src/data src/worker/listing-ids.json
          git commit -m "Listings updated from MLS (sync)" -m "$(cat sync-report.txt)"
          git push
      - if: ${{ !inputs.dry }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTENTION: ${{ steps.sync.outputs.attention }}
        run: |
          n=$(gh issue list --state open --search "Listings need a look in:title" --json number --jq '.[0].number')
          if [ "$ATTENTION" != "true" ]; then
            if [ -n "$n" ]; then gh issue close "$n" --comment "Nothing needs a look any more: every active listing matches MLS."; fi
            exit 0
          fi
          if [ -z "$n" ]; then gh issue create --title "Listings need a look (MLS sync)" --body-file sync-report.txt; exit 0; fi
          # Say it once: only add a comment when the report differs from the last thing said on the issue.
          last=$(gh issue view "$n" --json body,comments --jq 'if (.comments|length) > 0 then .comments[-1].body else .body end')
          if [ "$(printf '%s' "$last" | tr -d '[:space:]')" != "$(tr -d '[:space:]' < sync-report.txt)" ]; then gh issue comment "$n" --body-file sync-report.txt; fi

# Daily price sync for Jared's own listing pages (D-298, tools/sync_listings.mjs).
# Reads his active listings from MyRealPage. A changed price is written, the site is built and tested, and the change is pushed to main,
# which deploys it. Anything else (a listing that left the market, a new listing with no page) is reported in an issue, not edited.
name: Listing price sync
on:
  schedule:
    - cron: '23 13 * * *'   # 5:23 or 6:23 am Pacific
    - cron: '23 22 * * *'   # 2:23 or 3:23 pm Pacific
  workflow_dispatch:
    inputs:
      dry:
        description: 'Report only, change nothing'
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: listing-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: sync
        run: node tools/sync_listings.mjs ${{ inputs.dry && '--dry' || '' }}
      - if: steps.sync.outputs.changed == 'true'
        run: |
          npm ci
          npm run lastmod
          npm test
      - if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "listing-sync"
          git config user.email "listing-sync@users.noreply.github.com"
          git add src/data
          git commit -m "Listing prices updated from MLS (daily sync)" -m "$(cat sync-report.txt)"
          git push
      - if: steps.sync.outputs.attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "Listings need a look in:title" --json number --jq '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file sync-report.txt; else gh issue create --title "Listings need a look (MLS sync)" --body-file sync-report.txt; fi

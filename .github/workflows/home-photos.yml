# One-off helper (audit 2026-11-13, item 9): make 640w copies of the homepage listing-card photos.
# Runs on a push to the home-photos-640 branch, downloads each photo's 1600w version from the live site,
# resizes it to 640w WebP and commits the files to public/img/home-cards/. Delete this file before merging.
name: home-photos
on:
  push:
    branches: [home-photos-640]
    paths: [.github/workflows/home-photos.yml]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save sharp@0.33.5
      - run: |
          mkdir -p public/img/home-cards
          for id in 1807886ebc629e08 1c03eaed2ccb3f23 6152550c5ddba45b 7570935dda5af790 85e0dedd94aee852 a39bf980935f689b a6dd497c2d378272 c3651db7533f9b00 eff40a8c4d163dea f0cdd078d8b19220 fd647ea877e8c739; do
            curl -fsSL "https://jaredgibbons.ca/listing-photos/${id}-1600.webp" -o "/tmp/${id}.webp"
            node -e "require('sharp')('/tmp/${id}.webp').resize({width:640}).webp({quality:78}).toFile('public/img/home-cards/${id}-640.webp').then(i=>console.log('${id}',i.width,i.height,i.size))"
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/img/home-cards
          git commit -m "Homepage card photos at 640w (generated by the home-photos workflow)"
          git push
